# 只给构建机 / CI 用的覆盖文件：给 client/web/docker-compose.yml 的 service 补上 build 段。
# 部署机上不需要这个文件，部署机只 docker compose pull。
#
#   在算力好的机器上（client/web/ 目录）：
#     docker compose -f docker-compose.yml -f docker-compose.build.yml build
#     docker push <NIFE_REMOTE_WEB_IMAGE 指向的仓库名>:<tag>
#
#   构建机的架构决定镜像的架构；部署机是 amd64 而构建机是 Apple 芯片时，用 buildx 指定：
#     docker buildx build --platform linux/amd64 -f client/web/Dockerfile \
#       -t <registry>/nife-remote-web:<version> --push .
#     （构建上下文是仓库根目录：这个镜像要同时编前端和 Rust 服务）
services:
  nife-remote-web:
    build:
      context: ../..
      dockerfile: client/web/Dockerfile
