[package]
name = "nife-remote"
description = "Nife Remote remote desktop client (controller and host in one program)"
version = "0.0.2"
edition = "2024"
license = "MIT"
default-run = "nife-remote"

# 客户端是独立工作区，与服务端工作区互不影响
[workspace]

[lib]
name = "nife_remote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nife-remote-proto = { path = "../../crates/nife-remote-proto" }
# 与中转服务器的连接、控制端会话，控制台的 WebSocket 协议（与网页控制台共用）
nife-remote-link = { path = "../../crates/nife-remote-link", features = ["console"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# 控制台窗口连本机的 WebSocket（只监听 127.0.0.1，见 src/console.rs）
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# config.toml：修改时保留用户的注释和格式
toml_edit = "0.25"
base64 = "0.23"
# 本地账号的密码摘要（见 src/accounts.rs）
sha2 = "0.10"
# 账号服务的 HTTP 调用（见 src/accounts.rs）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# 和 quinn 用同一个加密实现（ring）：rustls 0.23 要求进程里显式选一个，见 lib.rs 的 install_crypto_provider
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rand = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3", default-features = false }
# 编码：OpenH264（屏幕内容模式），YUV 转换与缩放均使用 SIMD
bytes = "1"
openh264 = "0.9"
openh264-sys2 = "0.9"
yuvutils-rs = "0.8"
fast_image_resize = "6"
# 声音：libopus（随包源码静态编译）
opus = "0.4"

# Windows 平台 API（被控端采集、编码、注入、服务、剪贴板）
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_System_Threading",
  "Win32_System_Services",
  "Win32_System_RemoteDesktop",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  # 声音设备的属性（控制端的麦克风：按接口名找 Steam Streaming Microphone、读它的设备格式）
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Security",
] }

[profile.release]
opt-level = 3
# 打包速度优先：不做跨 crate 的 LTO，并把函数切到很多代码生成单元，让 rustc 用满多核。
# 原来 lto = "fat" + codegen-units = 1：最后那一步只能单核跑（卡在 "544/546: nife-remote"）。
# 代价：体积大概 +2~5%，运行时性能差几个百分点（软件编码这种热循环仍在 opt-level 3）。
lto = false
codegen-units = 256
# 改了代码之后只重编变的那几个 CGU，不用整个 crate 重来
incremental = true
panic = "abort"
strip = true

# 开发模式下也优化编解码相关依赖，否则软件编码会很慢
[profile.dev.package."*"]
opt-level = 3
