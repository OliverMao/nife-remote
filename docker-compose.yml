# Nife Remote 中转服务器
#
# 部署机上**只拉镜像，不编译**：镜像在算力好的机器或 CI 上构建好、推送到镜像仓库（构建侧见 docker-compose.build.yml）。
#   准备：cp .env.example .env，把 NIFE_REMOTE_IMAGE 改成构建机推上去的那个镜像（带版本 tag，不要用 latest）
#   启动：docker compose pull && docker compose up -d
#   查看证书指纹：docker compose logs nife-remote | grep fingerprint
#   日志、状态：docker compose logs --tail=100 nife-remote / docker compose ps
#   Linux 宿主机上先调大 UDP 缓冲区的上限（容器里改不了，只能在宿主机调）：
#     sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
# 要在这台机器上临时构建（开发 / 测试用，不推荐在部署机上做）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
# 账号服务（server/auth）在同一个文件里：和中转服务器共用仓库根目录的 .env，一起 docker compose up -d。
# 网页控制台（在浏览器里使用的控制端）见 web/docker-compose.yml
services:
  nife-remote:
    # 和构建机打出来的 tag 必须完全一致（版本号取自仓库根 Cargo.toml 的 version）。
    # 升级就是把这个 tag 换掉：先在有算力的机器上构建 + 推送，再在部署机上 docker compose pull && docker compose up -d
    image: ${NIFE_REMOTE_IMAGE:?set NIFE_REMOTE_IMAGE in .env, e.g. mirror.naig.us/nife-remote-server:0.0.1}
    container_name: nife-remote-server
    restart: unless-stopped
    ports:
      - "4433:4433/udp" # QUIC 只需要 UDP
    volumes:
      - ./data:/data # 自动生成的 TLS 证书（保持不变，客户端靠指纹校验）和 SQLite 数据库 nife-remote.db（固定的控制码、给控制码密钥签名的服务器密钥）
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # 证书 SAN：可不填（只按指纹校验，不看域名）；仅首次生成证书时生效
      NIFE_REMOTE_CERT_NAMES: ${NIFE_REMOTE_CERT_NAMES:-nife-remote,localhost}
      # 每台被控端最多允许几个控制端同时连接
      NIFE_REMOTE_MAX_SESSIONS: ${NIFE_REMOTE_MAX_SESSIONS:-4}
      # 同一个来源（IPv4 地址 / IPv6 的 /64）最多同时几条连接；很多被控端共用一个出口 IP 时调大
      NIFE_REMOTE_MAX_CONNS_PER_IP: ${NIFE_REMOTE_MAX_CONNS_PER_IP:-128}
      # 同一个来源（IPv4 地址 / IPv6 的 /48）10 分钟内最多分配几个新控制码（取回原来的不算）
      NIFE_REMOTE_NEW_CODES_PER_IP: ${NIFE_REMOTE_NEW_CODES_PER_IP:-30}
      # 同一个来源（IPv4 地址 / IPv6 的 /64）一分钟内最多向同一台被控端发起几次连接（不低于 NIFE_REMOTE_MAX_SESSIONS）
      NIFE_REMOTE_CONNECTS_PER_MINUTE: ${NIFE_REMOTE_CONNECTS_PER_MINUTE:-6}
      # 自己的证书：挂载到 /data 后改这两项
      NIFE_REMOTE_CERT: ${NIFE_REMOTE_CERT:-/data/cert.pem}
      NIFE_REMOTE_KEY: ${NIFE_REMOTE_KEY:-/data/key.pem}
      # SQLite 数据库：固定控制码的绑定表（别删），默认在证书旁边
      NIFE_REMOTE_DB: ${NIFE_REMOTE_DB:-/data/nife-remote.db}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ── 账号服务（server/auth，FastAPI）：注册 / 登录 / 本账号设备 ──
  # 和中转服务器互不影响：没配镜像就注释掉这一段，远程控制照样能用，只是登录用不了。
  nife-remote-auth:
    image: ${NIFE_REMOTE_AUTH_IMAGE:?set NIFE_REMOTE_AUTH_IMAGE in .env, e.g. mirror.naig.us/nife-remote-auth:0.0.1}
    container_name: nife-remote-auth
    restart: unless-stopped
    ports:
      - "${NIFE_REMOTE_AUTH_PORT:-8080}:8080" # HTTP，建议后面挂 Caddy 反代 /auth/* 和 /health
    volumes:
      - ./data/auth:/data # accounts.json（账号 + 登录凭证 + 每个账号的设备列表），权限 600，记得备份
    environment:
      NIFE_REMOTE_AUTH_DATA: /data
      NIFE_REMOTE_AUTH_DB: /data/accounts.json
      NIFE_REMOTE_AUTH_TOKEN_TTL: ${NIFE_REMOTE_AUTH_TOKEN_TTL:-2592000}
      NIFE_REMOTE_AUTH_REGISTRATION: ${NIFE_REMOTE_AUTH_REGISTRATION:-open}
      NIFE_REMOTE_AUTH_MAX_USERS: ${NIFE_REMOTE_AUTH_MAX_USERS:-1000}
      NIFE_REMOTE_AUTH_ROUNDS: ${NIFE_REMOTE_AUTH_ROUNDS:-200000}
      # 一个账号都没有时自动建的账号（登录后请改密码）
      NIFE_REMOTE_AUTH_DEFAULT_USER: ${NIFE_REMOTE_AUTH_DEFAULT_USER:-niferemote}
      NIFE_REMOTE_AUTH_DEFAULT_PASSWORD: ${NIFE_REMOTE_AUTH_DEFAULT_PASSWORD:-niferemote}
      # 分配给客户端的中转服务器（客户端只填账号服务地址，地址和指纹都从这里来）
      NIFE_REMOTE_AUTH_RELAY_HOST: ${NIFE_REMOTE_AUTH_RELAY_HOST:-}
      NIFE_REMOTE_AUTH_RELAY_PORT: ${NIFE_REMOTE_AUTH_RELAY_PORT:-4433}
      NIFE_REMOTE_AUTH_RELAY_FP: ${NIFE_REMOTE_AUTH_RELAY_FP:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
