# Nife Remote 中转服务器
#
# 部署机上**只拉镜像，不编译**：镜像在算力好的机器或 CI 上构建好、推送到镜像仓库（构建侧见 docker-compose.build.yml）。
#   准备：cp .env.example .env，把 NIFE_REMOTE_IMAGE 改成构建机推上去的那个镜像（带版本 tag，不要用 latest）
#   启动：docker compose pull && docker compose up -d
#   查看证书指纹：docker compose logs nife-remote | grep fingerprint
#   日志、状态：docker compose logs --tail=100 nife-remote / docker compose ps
#   Linux 宿主机上先调大 UDP 缓冲区的上限（容器里改不了，只能在宿主机调）：
#     sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
# 要在这台机器上临时构建（开发 / 测试用，不推荐在部署机上做）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
# 网页控制台（在浏览器里使用的控制端）见 web/docker-compose.yml
services:
  nife-remote:
    # 和构建机打出来的 tag 必须完全一致（版本号取自仓库根 Cargo.toml 的 version）。
    # 升级就是把这个 tag 换掉：先在有算力的机器上构建 + 推送，再在部署机上 docker compose pull && docker compose up -d
    image: ${NIFE_REMOTE_IMAGE:?set NIFE_REMOTE_IMAGE in .env, e.g. registry.example.com/nife-remote-server:0.0.1}
    container_name: nife-remote-server
    restart: unless-stopped
    ports:
      - "4433:4433/udp" # QUIC 只需要 UDP
    volumes:
      - ./data:/data # 自动生成的 TLS 证书（保持不变，客户端靠指纹校验）和 SQLite 数据库 nife-remote.db（固定的控制码、给控制码密钥签名的服务器密钥）
    environment:
      RUST_LOG: info
      # 自动生成证书时写入的域名/IP（逗号分隔）
      NIFE_REMOTE_CERT_NAMES: nife-remote,localhost
      # 每台被控端最多允许几个控制端同时连接
      NIFE_REMOTE_MAX_SESSIONS: "4"
      # 同一个来源（IPv4 地址 / IPv6 的 /64）最多同时几条连接；很多被控端共用一个出口 IP 时调大
      # NIFE_REMOTE_MAX_CONNS_PER_IP: "128"
      # 同一个来源（IPv4 地址 / IPv6 的 /48）10 分钟内最多分配几个新控制码（取回原来的不算）
      # NIFE_REMOTE_NEW_CODES_PER_IP: "30"
      # 同一个来源（IPv4 地址 / IPv6 的 /64）一分钟内最多向同一台被控端发起几次连接（不低于 NIFE_REMOTE_MAX_SESSIONS）
      # NIFE_REMOTE_CONNECTS_PER_MINUTE: "6"
      # 如需使用自己的证书，挂载到 /data 并修改以下路径
      # NIFE_REMOTE_CERT: /data/cert.pem
      # NIFE_REMOTE_KEY: /data/key.pem
      # SQLite 数据库：固定控制码的绑定表（保存了控制码的被控端离线多久都能取回原来的控制码），默认在证书旁边
      # NIFE_REMOTE_DB: /data/nife-remote.db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
